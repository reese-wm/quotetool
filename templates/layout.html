<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00412f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BV Tools">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="{{ url_for('web_manifest') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('app_icon', size=192) }}">
    <link rel="apple-touch-icon" href="{{ url_for('app_icon', size=192) }}">
    <title>{% block title %}Big Valley Tools{% endblock %}</title>
    <style>
        :root {
            --forest: #00412f;
            --deep-forest: #002f23;
            --green: #096a45;
            --gold: #d9a320;
            --gold-dark: #9f7410;
            --sky: #dce8ee;
            --cream: #f7f1e4;
            --paper: #ffffff;
            --ink: #1e2a25;
            --muted: #5f6962;
            --line: #d9ded6;
            --shadow: 0 18px 34px rgba(0, 37, 27, 0.14);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Aptos", "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(247, 241, 228, 0.8), rgba(220, 232, 238, 0.72)),
                url("{{ url_for('static', filename='header.png') }}") center top / min(980px, 100vw) auto no-repeat,
                #edf3f1;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .site-shell {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 18px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 14px;
            margin-bottom: 24px;
            background: rgba(0, 65, 47, 0.92);
            border: 1px solid rgba(217, 163, 32, 0.45);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand img {
            height: 54px;
            width: auto;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 6px;
            padding: 4px 7px;
        }

        .brand-copy h1 {
            margin: 0;
            font-size: clamp(1.1rem, 2vw, 1.45rem);
            color: #fff7da;
        }

        .brand-copy p {
            margin: 4px 0 0;
            color: rgba(255, 255, 255, 0.78);
            font-size: 0.92rem;
        }

        .brand-badge {
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            width: 74px;
            height: 74px;
            margin-left: auto;
            border: 3px solid var(--gold);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 34%, #155b3e 0, var(--deep-forest) 72%);
            color: #f8d56f;
            text-align: center;
            box-shadow: inset 0 0 0 2px rgba(255, 244, 181, 0.22), 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .brand-badge strong {
            display: block;
            font-size: 1.8rem;
            line-height: 0.9;
        }

        .brand-badge span {
            display: block;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .nav-links a {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #fff7da;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 235, 165, 0.2);
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .nav-links a:hover {
            transform: translateY(-1px);
            background: rgba(217, 163, 32, 0.22);
        }

        .page-card {
            background: var(--paper);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 65, 47, 0.1);
            padding: 24px;
        }

        .hero {
            padding: clamp(24px, 4vw, 42px);
            border-radius: var(--radius);
            background:
                linear-gradient(90deg, rgba(0, 47, 35, 0.9) 0%, rgba(0, 65, 47, 0.82) 46%, rgba(247, 241, 228, 0.5) 100%),
                url("{{ url_for('static', filename='header.png') }}") center / cover no-repeat,
                var(--forest);
            color: white;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(217, 163, 32, 0.55);
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 8px;
            background: linear-gradient(90deg, var(--gold), #ffe18d, var(--gold-dark));
        }

        .eyebrow {
            display: inline-block;
            width: fit-content;
            padding: 7px 10px;
            margin-bottom: 14px;
            border-radius: 5px;
            background: rgba(217, 163, 32, 0.92);
            color: #1d2116;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .hero h2 {
            margin: 0 0 12px;
            font-size: clamp(1.85rem, 4vw, 3rem);
            line-height: 1.05;
            max-width: 700px;
            color: #fff8df;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.32);
        }

        .hero p {
            margin: 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.02rem;
            line-height: 1.6;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.26);
        }

        .tool-grid,
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-top: 24px;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 22px;
            border-radius: var(--radius);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 246, 238, 0.98));
            border: 1px solid rgba(0, 65, 47, 0.14);
            border-top: 4px solid var(--gold);
            box-shadow: 0 14px 26px rgba(0, 47, 35, 0.1);
            min-height: 260px;
        }

        .tool-card .badge {
            width: fit-content;
            padding: 7px 10px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: white;
            background: var(--forest);
        }

        .tool-card h3 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--forest);
        }

        .tool-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .tool-card ul {
            margin: 0;
            padding-left: 18px;
            color: var(--ink);
            line-height: 1.6;
        }

        .tool-card .cta,
        button,
        .button-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            min-width: 160px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(180deg, #0d6c49, var(--forest));
            color: white;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 10px 20px rgba(0, 65, 47, 0.22);
        }

        .tool-card .cta:hover,
        button:hover,
        .button-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(0, 65, 47, 0.28);
        }

        .form-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .form-stack {
            display: grid;
            gap: 18px;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 10px 22px rgba(0, 47, 35, 0.07);
        }

        .form-section h3 {
            margin: 0 0 14px;
            color: var(--forest);
            font-size: 1.1rem;
            border-bottom: 2px solid rgba(217, 163, 32, 0.38);
            padding-bottom: 8px;
        }

        .section-hint,
        .sidebar-card p,
        .summary-tile p {
            color: var(--muted);
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .form-grid.single {
            grid-template-columns: 1fr;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--deep-forest);
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfd8cd;
            border-radius: 6px;
            background: #fffdf8;
            color: var(--ink);
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid rgba(217, 163, 32, 0.24);
            border-color: var(--green);
        }

        .sidebar-card,
        .result-card {
            background:
                linear-gradient(180deg, rgba(255, 253, 248, 0.97), rgba(247, 241, 228, 0.97));
            border: 1px solid #dccb9d;
            border-top: 4px solid var(--gold);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 12px 24px rgba(91, 71, 23, 0.08);
        }

        .sidebar-card h3,
        .result-card h3 {
            margin-top: 0;
            color: var(--forest);
        }

        .sidebar-card ul {
            margin: 0;
            padding-left: 18px;
            line-height: 1.7;
        }

        .summary-tile {
            padding: 20px;
            border-radius: var(--radius);
            background: #fffdf8;
            border: 1px solid var(--line);
        }

        .summary-tile h4 {
            margin: 0 0 8px;
            color: var(--forest);
            font-size: 1rem;
        }

        .money {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--green);
        }

        .print-shell {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .print-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid var(--line);
        }

        .print-header {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: start;
            margin-bottom: 26px;
        }

        .print-title h2 {
            margin: 0;
            color: var(--forest);
            font-size: 2rem;
        }

        .print-title p,
        .print-meta p,
        .print-block p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .print-meta {
            text-align: right;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .print-block {
            padding: 18px;
            border-radius: var(--radius);
            background: #fffdf8;
            border: 1px solid var(--line);
        }

        .print-block h4 {
            margin: 0 0 10px;
            color: var(--forest);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 14px 10px;
            border-bottom: 1px solid #e2e9ef;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--forest);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        td.amount,
        th.amount {
            text-align: right;
        }

        .totals {
            margin-top: 20px;
            margin-left: auto;
            width: min(320px, 100%);
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #e2e9ef;
            color: var(--ink);
        }

        .totals-row.final {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--forest);
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .muted-note {
            margin-top: 18px;
            color: var(--muted);
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .tool-grid,
            .summary-grid,
            .detail-grid,
            .form-layout {
                grid-template-columns: 1fr;
            }

            .print-header,
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .print-meta {
                text-align: left;
            }
        }

        @media (max-width: 640px) {
            .site-shell {
                width: min(100% - 20px, 1120px);
            }

            .hero,
            .page-card,
            .print-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .brand img {
                height: 48px;
            }

            .brand-badge {
                width: 62px;
                height: 62px;
            }

            .brand-badge strong {
                font-size: 1.45rem;
            }

            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }

            .tool-card .cta,
            button,
            .button-link {
                width: 100%;
            }
        }

        @media print {
            body {
                background: white;
            }

            .topbar,
            .action-row {
                display: none;
            }

            .site-shell {
                width: 100%;
                padding: 0;
            }

            .print-card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="site-shell">
        <div class="topbar">
            <div class="brand">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Big Valley logo">
                <div class="brand-copy">
                    <h1>Big Valley Quote Suite</h1>
                    <p>Install quotes, service bills, and purchase orders from one place.</p>
                </div>
            </div>
            <div class="brand-badge" aria-label="Celebrating 40 years, 1986 to 2026">
                <span>Celebrating</span>
                <strong>40</strong>
                <span>Years</span>
            </div>

            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('install_quote') }}">Install Quote</a>
                <a href="{{ url_for('service_quote') }}">Service Bill</a>
                <a href="{{ url_for('purchase_order') }}">Purchase Order</a>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("{{ url_for('service_worker') }}");
            });
        }
    </script>
</body>
</html>
